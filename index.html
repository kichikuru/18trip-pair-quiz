<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>18TRIP ペア名クイズ</title>
<style>
:root{--pink:#ff6c9d;--purple:#7968dc;--yellow:#ffd96a;--ink:#28243b;--muted:#77738b;--paper:#fffdfb;--line:#eee8f2;--green:#26a879;--red:#e45c70}
*{box-sizing:border-box} body{margin:0;background:linear-gradient(135deg,#fff1f5,#f1efff 55%,#fff8df);font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:var(--ink);min-height:100vh;padding:20px}
.wrap{max-width:760px;margin:0 auto}.brand{text-align:center;margin:12px 0 20px}.eyebrow{font-size:12px;letter-spacing:.18em;color:var(--purple);font-weight:800}.brand h1{font-size:clamp(27px,6vw,42px);margin:5px 0;color:#39304f;line-height:1.15}.brand p{margin:8px 0;color:var(--muted);font-size:14px}
.card{background:rgba(255,255,255,.94);border:1px solid rgba(255,255,255,.9);border-radius:24px;padding:clamp(18px,4vw,30px);box-shadow:0 14px 40px #66538b18;margin-bottom:16px}
h2{font-size:20px;margin:0 0 16px}.field{margin:15px 0}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:8px;color:#59536e}
select,button{font:inherit}select{width:100%;border:1.5px solid var(--line);border-radius:13px;padding:12px 14px;background:#fff;color:var(--ink);font-size:15px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.primary,.secondary,.choice{border:0;border-radius:15px;cursor:pointer;transition:.15s}.primary{width:100%;padding:15px;background:linear-gradient(100deg,var(--pink),#ff9c82);color:#fff;font-weight:900;font-size:17px;box-shadow:0 7px 15px #ff6c9d38}.primary:hover,.choice:hover{transform:translateY(-2px)}.secondary{padding:11px 15px;background:#f2effb;color:#5f50b5;font-weight:800}.hint{font-size:12px;color:var(--muted);line-height:1.6}
.hidden{display:none!important}.topline{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:13px;color:var(--muted);font-weight:800}.progress{height:8px;background:#f0edf4;border-radius:20px;overflow:hidden;margin:12px 0 22px}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--purple));transition:width .2s}
.tag{display:inline-block;background:#fff1f5;color:#d94e83;border-radius:100px;padding:6px 11px;font-size:12px;font-weight:900;margin-bottom:12px}.question-name{font-size:clamp(24px,5vw,34px);font-weight:950;text-align:center;line-height:1.4;margin:8px 0 22px;overflow-wrap:anywhere}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{padding:16px 12px;background:#f7f5fb;border:2px solid #f0edf5;color:var(--ink);font-weight:800;min-height:72px;font-size:15px;line-height:1.45}.choice:disabled{cursor:default;transform:none}.choice.correct{border-color:var(--green);background:#e9faf3;color:#167b58}.choice.wrong{border-color:var(--red);background:#fff0f2;color:#b63e55}.feedback{border-radius:14px;padding:13px 15px;margin-top:15px;font-weight:800;line-height:1.6}.feedback.good{background:#e9faf3;color:#167b58}.feedback.bad{background:#fff0f2;color:#b63e55}
.actions{display:flex;justify-content:flex-end;margin-top:16px}.exit-action{display:flex;justify-content:flex-start;margin-top:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.stat{background:#f8f6fc;border-radius:15px;padding:14px;text-align:center}.stat strong{display:block;font-size:25px;color:var(--purple)}.stat span{font-size:12px;color:var(--muted);font-weight:800}
.review-item{border-bottom:1px solid var(--line);padding:12px 0;font-size:14px;line-height:1.6}.review-item:last-child{border:0}.ok{color:var(--green);font-weight:900}.ng{color:var(--red);font-weight:900}
.study-pair{font-size:22px;font-weight:900;text-align:center;padding:18px 8px}.study-name{font-size:20px;text-align:center;color:var(--purple);font-weight:900}
footer{text-align:center;color:#918ba1;font-size:11px;padding:10px}
@media(max-width:520px){body{padding:12px}.row{grid-template-columns:1fr}.choices{grid-template-columns:1fr}.choice{min-height:60px}.stats{gap:6px}.stat{padding:11px 5px}}
:root {
  --pink: #A8D957;

  --yellow: #E8F3B8;

  --line: #E2EBD6;
  --green: #26A879;
  --red: #E45C70;
}

body {
  background: linear-gradient(135deg, #F7FAF1, #EAF4D9 55%, #F8F8E9);

}

.eyebrow {
  color: #729C43;
}

.brand h1 {
  color: #344A32;
}

.card {
  box-shadow: 0 14px 40px #729C4318;
}

.field label {
  color: #526A48;
}

select {
  border-color: #DCE8CE;
}

.primary {
  background: linear-gradient(100deg, #A8D957, #C5E982);

}

.secondary {
  background: #EEF5E5;
  color: #648B3F;
}

.progress {
  background: #EAF0E2;
}

.bar {
  background: linear-gradient(90deg, #A8D957, #729C43);
}

.tag {
  background: #EFF7E5;

}

.choice {
  background: #F6F9F1;

}

.study-name {

}

.stat {
  background: #F4F8ED;
}

.stat strong {
  color: #729C43;
}
</style>
</head>
<body>
<div class="wrap">
<header class="brand"><div class="eyebrow">18TRIP · PAIR NAME TRAINING</div><h1>ペア名クイズ ✦</h1><p>190組のペア名、どこまで覚えてる？</p></header>

<section id="setup" class="card">
<h2>あそびかたを選んでね！</h2>
<div class="field"><label for="mode">出題モード</label>
<select id="mode">
<option value="all">全ペアから出題（190組）</option>
<option value="cross">別ユニット同士のみ</option>
<option value="fixed">特定キャラ固定「〇〇と誰？」</option>
<option value="study">全190組を順番に確認（暗記モード）</option>
</select></div>
<div class="field hidden" id="fixedField"><label for="fixedChar">固定するキャラクター</label><select id="fixedChar"></select></div>
<div class="row" id="quizOptions">
<div class="field"><label for="count">出題数</label><select id="count"><option value="10">10問</option><option value="20">20問</option><option value="50">50問</option><option value="all">対象ペアすべて</option></select></div>
<div class="field"><label for="order">出題順</label><select id="order"><option value="random">ランダム</option><option value="list">リスト順</option></select></div>
</div>
<p class="hint" id="modeHint">ペア名を見て、該当する2人の組み合わせを4択から選ぼう！正解数と正答率は最後に表示されるよ。</p>
<button class="primary" id="startBtn">スタート！</button>
</section>

<section id="quiz" class="card hidden">
<div class="topline"><span id="counter">第 1 問</span><span id="scoreNow">正解 0</span></div>
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="tag">このペア名はだれとだれ？</div>
<div class="question-name" id="questionName"></div>
<div class="choices" id="choices"></div>
<div id="feedback" class="feedback hidden"></div>
<div class="actions"><button id="nextBtn" class="primary hidden" style="width:auto;padding:12px 24px">次の問題へ →</button></div>
<div class="exit-action"><button id="quitQuizBtn" class="secondary">途中でやめる</button></div>
</section>

<section id="study" class="card hidden">
<div class="topline"><span id="studyCounter">1 / 190</span><span>暗記モード</span></div>
<div class="progress"><div class="bar" id="studyBar"></div></div>
<div class="tag">ペア名をチェック！</div>
<div class="study-pair" id="studyPair"></div>
<div class="study-name" id="studyName"></div>
<div class="actions" style="justify-content:space-between"><button class="secondary" id="studyPrev">← 前へ</button><button class="primary" id="studyNext" style="width:auto;padding:12px 24px">次へ →</button></div>
<div class="exit-action"><button id="quitStudyBtn" class="secondary">暗記モードを終了</button></div>
<div class="hint" style="text-align:center;margin-top:14px">全190組を順番に確認できるよ。</div>
</section>

<section id="result" class="card hidden">
<h2 style="text-align:center">おつかれさま！ 🎉</h2>
<div class="stats">
<div class="stat"><strong id="finalScore">0 / 0</strong><span>正解数</span></div>
<div class="stat"><strong id="accuracy">0%</strong><span>正答率</span></div>
<div class="stat"><strong id="missed">0</strong><span>間違えた問題</span></div>
</div>
<div id="review"></div>
<button class="primary" id="againBtn" style="margin-top:18px">もう一度あそぶ！</button>
<button class="secondary" id="homeBtn" style="width:100%;margin-top:10px">設定に戻る</button>
</section>

</div>

const $ = id => document.getElementById(id);
const unitOf = name => DATA.units.findIndex(u => u.includes(name));
let questions=[], index=0, score=0, answers=[], studyIndex=0;

DATA.characters.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;$('fixedChar').appendChild(o)});
function show(id){['setup','quiz','study','result'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function eligible(){
 const mode=$('mode').value;
 if(mode==='cross') return DATA.pairs.filter(p=>unitOf(p.a)!==unitOf(p.b));
 if(mode==='fixed'){const c=$('fixedChar').value;return DATA.pairs.filter(p=>p.a===c||p.b===c)}
 return [...DATA.pairs];
}
$('mode').addEventListener('change',()=>{
 const m=$('mode').value;
 $('fixedField').classList.toggle('hidden',m!=='fixed');
 $('quizOptions').classList.toggle('hidden',m==='study');
 $('modeHint').textContent=m==='cross'?'同じユニット内のペアを除外して、別ユニット同士のペアだけを出題するよ。':m==='fixed'?'選んだキャラクターと組む相手を、キャラクター名だけの4択から選ぶよ。':m==='study'?'全190組を順番に表示する暗記モード。ペア名と2人の組み合わせを一緒に確認できるよ。':'ペア名を見て、該当する2人の組み合わせを4択から選ぼう！正解数と正答率は最後に表示されるよ。';
});
function start(){
 const m=$('mode').value;
 if(m==='study'){studyIndex=0;show('study');renderStudy();return}
 let pool=eligible();if(!pool.length){alert('この条件に該当するペアがありません');return}
 if($('order').value==='random')pool=shuffle(pool);
 const n=$('count').value;questions=n==='all'?pool:pool.slice(0,Math.min(Number(n),pool.length));
 index=0;score=0;answers=[];show('quiz');renderQuestion();
}
function renderQuestion(){
 const q=questions[index];
 $('counter').textContent=`第 ${index+1} 問 / ${questions.length} 問`;
 $('scoreNow').textContent=`正解 ${score}`;
 $('bar').style.width=`${index/questions.length*100}%`;
 $('questionName').textContent=q.name;
 $('feedback').className='feedback hidden';$('nextBtn').classList.add('hidden');
 const fixedMode=$('mode').value==='fixed';
 let options;
 if(fixedMode){
  const fixed=$('fixedChar').value;
  const correctName=q.a===fixed?q.b:q.a;
  const distractors=shuffle(DATA.characters.filter(c=>c!==fixed&&c!==correctName)).slice(0,3);
  options=shuffle([correctName,...distractors]);
 }else{
  const wrongPool=DATA.pairs.filter(p=>p.id!==q.id);
  const distractors=shuffle(wrongPool).slice(0,3);
  options=shuffle([q,...distractors]);
 }
 const box=$('choices');box.innerHTML='';
 options.forEach(option=>{
  const b=document.createElement('button');b.className='choice';
  b.textContent=fixedMode?option:`${option.a} ＋ ${option.b}`;
  b.addEventListener('click',()=>answer(q,option,b));box.appendChild(b);
 });
}
function answer(q,option,button){
 const buttons=[...$('choices').children];buttons.forEach(b=>b.disabled=true);
 const fixedMode=$('mode').value==='fixed';
 const fixed=$('fixedChar').value;
 const correctName=q.a===fixed?q.b:q.a;
 const correct=fixedMode?option===correctName:option.id===q.id;
 if(correct){score++;button.classList.add('correct')}else{
  button.classList.add('wrong');
  const correctLabel=fixedMode?correctName:`${q.a} ＋ ${q.b}`;
  const correctButton=buttons.find(b=>b.textContent===correctLabel||(!fixedMode&&b.textContent===`${q.b} ＋ ${q.a}`));
  if(correctButton)correctButton.classList.add('correct');
 }
 answers.push({q,correct,chosen:option});
 $('scoreNow').textContent=`正解 ${score}`;
 $('feedback').className=`feedback ${correct?'good':'bad'}`;
 $('feedback').textContent=fixedMode?(correct?`正解！ ${fixed} と ${correctName}`:`不正解… 正解は「${correctName}」`):(correct?`正解！ ${q.a} ＋ ${q.b}`:`不正解… 正解は「${q.a} ＋ ${q.b}」`);
 $('nextBtn').classList.remove('hidden');$('nextBtn').textContent=index===questions.length-1?'結果を見る →':'次の問題へ →';
}
$('nextBtn').addEventListener('click',()=>{if(index<questions.length-1){index++;renderQuestion()}else finish()});
function finish(){
 if(!answers.length){show('setup');return}
 const completed=answers.length;
 show('result');$('finalScore').textContent=`${score} / ${completed}`;
 $('accuracy').textContent=`${Math.round(score/completed*100)}%`;
 $('missed').textContent=answers.filter(a=>!a.correct).length;
 const review=$('review');review.innerHTML='<h2>まちがえた問題</h2>';
 const misses=answers.filter(a=>!a.correct);
 if(!misses.length){review.innerHTML+='<p class="ok">全問正解！すごい！！</p>';return}
 misses.forEach(a=>{const d=document.createElement('div');d.className='review-item';d.innerHTML=`<span class="ng">× ${escapeHtml(a.q.name)}</span><br>正解：${escapeHtml(a.q.a)} ＋ ${escapeHtml(a.q.b)}`;review.appendChild(d)});
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderStudy(){
 const p=DATA.pairs[studyIndex];
 $('studyCounter').textContent=`${studyIndex+1} / ${DATA.pairs.length}`;
 $('studyBar').style.width=`${(studyIndex+1)/DATA.pairs.length*100}%`;
 $('studyPair').textContent=`${p.a} ＋ ${p.b}`;$('studyName').textContent=p.name;
 $('studyPrev').disabled=studyIndex===0;
 $('studyNext').textContent=studyIndex===DATA.pairs.length-1?'最初に戻る ↺':'次へ →';
}
$('studyPrev').addEventListener('click',()=>{if(studyIndex>0){studyIndex--;renderStudy()}});
$('studyNext').addEventListener('click',()=>{studyIndex=studyIndex===DATA.pairs.length-1?0:studyIndex+1;renderStudy()});
$('quitQuizBtn').addEventListener('click',()=>finish());
$('quitStudyBtn').addEventListener('click',()=>show('setup'));
$('startBtn').addEventListener('click',start);
$('againBtn').addEventListener('click',start);
$('homeBtn').addEventListener('click',()=>show('setup'));
</script>
